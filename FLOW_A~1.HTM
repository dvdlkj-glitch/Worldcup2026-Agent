<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC26 // AGENT — 系統動畫流程</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(1100px 540px at 18% -8%, #0d2030 0%, #070b12 50%), #070b12;
  color: #d7e4f2; font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 24px 12px; overflow-x: hidden;
}
h1 { font-family: 'Orbitron', 'Noto Sans TC', sans-serif; font-size: 1.5rem;
  background: linear-gradient(90deg, #00ffb2, #00aaff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 2px; text-align: center; }
.sub { color: #8fa6bd; margin: 6px 0 18px; font-size: .95rem; text-align: center; }

.stage-caption {
  font-size: 1.05rem; color: #ffd84d; min-height: 1.6em; margin-bottom: 14px;
  text-align: center; font-weight: 500; transition: opacity .4s;
  text-shadow: 0 0 14px rgba(255,216,77,.3);
}

svg { width: 100%; max-width: 860px; height: auto; }

.node {
  fill: rgba(255,255,255,.03); stroke: rgba(255,255,255,.14);
  stroke-width: 1.2; rx: 14;
  transition: stroke .4s, filter .4s;
}
.node.on { stroke: #00ffb2; filter: drop-shadow(0 0 10px rgba(0,255,178,.5)); }
.node.gold.on { stroke: #ffd84d; filter: drop-shadow(0 0 12px rgba(255,216,77,.55)); }

.nlabel { font-family: 'Orbitron', sans-serif; font-size: 11px; fill: #00ffb2;
  letter-spacing: 2px; }
.ntext  { font-size: 13px; fill: #d7e4f2; font-weight: 700;
  font-family: 'Noto Sans TC', sans-serif; }
.nsub   { font-size: 10.5px; fill: #7d93ab; font-family: 'Noto Sans TC', sans-serif; }

.pipe { fill: none; stroke: rgba(0,170,255,.22); stroke-width: 2; }
.dot  { fill: #00ffb2; filter: drop-shadow(0 0 6px #00ffb2); }
.dot.blue { fill: #00aaff; filter: drop-shadow(0 0 6px #00aaff); }
.dot.gold { fill: #ffd84d; filter: drop-shadow(0 0 6px #ffd84d); }

.scoreTxt { font-family: 'Orbitron', sans-serif; font-size: 17px; fill: #00ffb2; }
.liveDot { fill: #ff3b5c; }
@keyframes pulse { 0%,100% { opacity: 1; r: 4; } 50% { opacity: .35; r: 5.5; } }
.liveDot { animation: pulse 1.4s infinite; }

.ball { font-size: 18px; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.ball-wrap { animation: spin 4s linear infinite; transform-origin: center; transform-box: fill-box; }

.barbg { fill: rgba(255,255,255,.07); rx: 4; }
.bar   { fill: url(#gradBar); rx: 4; }

.legend { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap;
  justify-content: center; color: #7d93ab; font-size: .85rem; }
.legend span b { color: #d7e4f2; }
.chip { display:inline-block; width:10px; height:10px; border-radius:50%;
  margin-right:5px; vertical-align:-1px; }

.controls { margin-top: 16px; }
button {
  background: rgba(0,255,178,.08); color: #00ffb2;
  border: 1px solid rgba(0,255,178,.4); border-radius: 999px;
  padding: 8px 22px; font-family: 'Orbitron', sans-serif; font-size: .8rem;
  letter-spacing: 2px; cursor: pointer;
}
button:hover { background: rgba(0,255,178,.16); }
.foot { color: #51677e; font-size: .8rem; margin-top: 18px; text-align: center; }

@media (max-width: 600px) {
  h1 { font-size: 1.1rem; } .sub { font-size: .8rem; }
  .stage-caption { font-size: .9rem; }
}
</style>
</head>
<body>

<h1>⚽ WC26 // AGENT 系統流程</h1>
<div class="sub">一顆資料訊號的旅程 — 從 API 到 AI 奪冠預測</div>
<div class="stage-caption" id="caption">準備開賽…</div>

<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffb2"/><stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>
  </defs>

  <!-- ===== 資料源 (左) ===== -->
  <g id="nodeFD">
    <rect class="node" x="30" y="60" width="200" height="92" rx="14"/>
    <text class="nlabel" x="50" y="88">DATA SOURCE 01</text>
    <text class="ntext"  x="50" y="112">football-data.org</text>
    <text class="nsub"   x="50" y="132">即時比分・賽程・12 組積分榜</text>
  </g>

  <g id="nodePM">
    <rect class="node" x="30" y="300" width="200" height="92" rx="14"/>
    <text class="nlabel" x="50" y="328">DATA SOURCE 02</text>
    <text class="ntext"  x="50" y="352">Polymarket 預測市場</text>
    <text class="nsub"   x="50" y="372">群眾下注 → 各隊奪冠機率</text>
  </g>

  <!-- ===== AI 核心 (中) ===== -->
  <g id="nodeAI">
    <rect class="node gold" x="330" y="170" width="210" height="150" rx="16"/>
    <text class="nlabel" x="352" y="200" fill="#ffd84d">AI AGENT CORE</text>
    <text class="ntext"  x="352" y="226">🤖 預測引擎</text>
    <text class="nsub"   x="352" y="248">市場賠率 60%</text>
    <rect class="barbg" x="352" y="256" width="166" height="8"/>
    <rect class="bar" id="bar60" x="352" y="256" width="0" height="8"/>
    <text class="nsub" x="352" y="284">即時戰績 40%</text>
    <rect class="barbg" x="352" y="292" width="166" height="8"/>
    <rect class="bar" id="bar40" x="352" y="292" width="0" height="8"/>
    <g class="ball-wrap"><text class="ball" x="495" y="230">⚽</text></g>
  </g>

  <!-- ===== 儀表板 (右) ===== -->
  <g id="nodeLive">
    <rect class="node" x="630" y="30" width="200" height="100" rx="14"/>
    <text class="nlabel" x="650" y="58">LIVE</text>
    <circle class="liveDot" cx="700" cy="54" r="4"/>
    <text class="ntext" x="650" y="84">🔴 即時比分</text>
    <text class="scoreTxt" id="score" x="650" y="112">MEX 0 : 0 KOR</text>
  </g>

  <g id="nodeTable">
    <rect class="node" x="630" y="160" width="200" height="80" rx="14"/>
    <text class="nlabel" x="650" y="188">STANDINGS</text>
    <text class="ntext" x="650" y="212">📊 12 組積分榜</text>
    <text class="nsub" x="650" y="230">前 2 晉級・第 3 名待定</text>
  </g>

  <g id="nodePick">
    <rect class="node gold" x="630" y="270" width="200" height="100" rx="14"/>
    <text class="nlabel" x="650" y="298" fill="#ffd84d">AI PROJECTION</text>
    <text class="ntext" x="650" y="324">🏆 奪冠預測</text>
    <text class="scoreTxt" id="pick" x="650" y="352" fill="#ffd84d">— —</text>
  </g>

  <g id="nodeOdds">
    <rect class="node" x="630" y="400" width="200" height="86" rx="14"/>
    <text class="nlabel" x="650" y="428">MARKET ODDS</text>
    <text class="ntext" x="650" y="452">💸 群眾賠率排行</text>
    <rect class="barbg" x="650" y="462" width="160" height="7"/>
    <rect class="bar" id="oddsBar" x="650" y="462" width="0" height="7"/>
  </g>

  <!-- ===== 管線 ===== -->
  <path class="pipe" id="p1" d="M 230 106 C 290 106, 290 210, 330 218"/>
  <path class="pipe" id="p2" d="M 230 346 C 290 346, 290 290, 330 282"/>
  <path class="pipe" id="p3" d="M 540 200 C 590 180, 590 90, 630 80"/>
  <path class="pipe" id="p4" d="M 540 230 C 590 220, 590 200, 630 200"/>
  <path class="pipe" id="p5" d="M 540 260 C 590 280, 590 320, 630 320"/>
  <path class="pipe" id="p6" d="M 540 290 C 590 330, 590 443, 630 443"/>

  <!-- 流動粒子 -->
  <circle class="dot"      r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle class="dot"      r="4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle class="dot blue" r="4"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle class="dot blue" r="4"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle class="dot gold" r="4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle class="dot gold" r="4"><animateMotion dur="2.5s" begin=".6s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  <circle class="dot gold" r="4"><animateMotion dur="2.3s" begin=".3s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
  <circle class="dot gold" r="4"><animateMotion dur="2.6s" begin=".9s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>

  <!-- 60s 更新計時環 -->
  <g transform="translate(430, 480)">
    <circle r="30" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>
    <circle id="timer" r="30" fill="none" stroke="#00ffb2" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"
            transform="rotate(-90)"/>
    <text x="0" y="-2" text-anchor="middle" class="scoreTxt" id="timerTxt" font-size="14">60s</text>
    <text x="0" y="16" text-anchor="middle" class="nsub" font-size="9">自動更新</text>
  </g>
</svg>

<div class="legend">
  <span><span class="chip" style="background:#00ffb2"></span><b>比分資料</b></span>
  <span><span class="chip" style="background:#00aaff"></span><b>市場賠率</b></span>
  <span><span class="chip" style="background:#ffd84d"></span><b>AI 運算結果</b></span>
</div>

<div class="controls"><button id="replay">↻ REPLAY 重播</button></div>
<div class="foot">WC26 // AGENT・David Lau World Cup Vision・僅為趣味展示，不構成投注建議</div>

<script>
const captions = [
  "第 1 步：每 60 秒向 football-data.org 抓取即時比分與積分榜",
  "第 2 步：同時讀取 Polymarket — 全球玩家用真金白銀投出的奪冠機率",
  "第 3 步：AI 引擎混合運算 — 市場賠率 60% + 球場上即時戰績 40%",
  "第 4 步：結果送進儀表板 — 即時比分、積分榜、奪冠預測、賠率排行",
  "進球了！比分即時跳動，AI 預測也跟著重新計算 ⚽",
];
const picks = ["🇪🇸 SPAIN 16%", "🇫🇷 FRANCE 16%", "🇪🇸 SPAIN 16%"];
const scores = ["MEX 0 : 0 KOR", "MEX 1 : 0 KOR", "MEX 1 : 1 KOR", "MEX 2 : 1 KOR"];

const cap = document.getElementById('caption');
const nodes = {
  fd: document.querySelector('#nodeFD .node'),
  pm: document.querySelector('#nodePM .node'),
  ai: document.querySelector('#nodeAI .node'),
  live: document.querySelector('#nodeLive .node'),
  table: document.querySelector('#nodeTable .node'),
  pick: document.querySelector('#nodePick .node'),
  odds: document.querySelector('#nodeOdds .node'),
};
let timers = [];

function setCap(t){ cap.style.opacity = 0;
  setTimeout(()=>{ cap.textContent = t; cap.style.opacity = 1; }, 300); }
function on(...ks){ ks.forEach(k => nodes[k].classList.add('on')); }
function offAll(){ Object.values(nodes).forEach(n => n.classList.remove('on')); }
function grow(id, w, delay){ timers.push(setTimeout(()=>{
  const el = document.getElementById(id);
  el.style.transition = 'width 1.2s ease'; el.setAttribute('width', 0);
  requestAnimationFrame(()=> el.style.width = w + 'px');
  el.setAttribute('width', w);
}, delay)); }

function play(){
  timers.forEach(clearTimeout); timers = []; offAll();
  document.getElementById('score').textContent = scores[0];
  document.getElementById('pick').textContent = '— —';
  ['bar60','bar40','oddsBar'].forEach(id =>
    document.getElementById(id).setAttribute('width', 0));

  timers.push(setTimeout(()=>{ setCap(captions[0]); on('fd'); }, 200));
  timers.push(setTimeout(()=>{ setCap(captions[1]); on('pm'); }, 3200));
  timers.push(setTimeout(()=>{ setCap(captions[2]); on('ai');
    grow('bar60', 100, 200); grow('bar40', 66, 700); }, 6200));
  timers.push(setTimeout(()=>{ setCap(captions[3]);
    on('live','table','pick','odds');
    document.getElementById('pick').textContent = picks[0];
    grow('oddsBar', 160, 300); }, 9400));
  // 進球秀
  scores.slice(1).forEach((s, i) => timers.push(setTimeout(()=>{
    setCap(captions[4]);
    document.getElementById('score').textContent = s;
    document.getElementById('pick').textContent = picks[(i+1) % picks.length];
  }, 12800 + i * 2600)));
  timers.push(setTimeout(play, 12800 + 3 * 2600 + 2000)); // loop
}

// 60s 計時環(加速演示: 6 秒跑完代表 60 秒)
const ring = document.getElementById('timer'), ttxt = document.getElementById('timerTxt');
let t0 = Date.now();
setInterval(()=>{
  const el = ((Date.now() - t0) / 6000) % 1;
  ring.setAttribute('stroke-dashoffset', 188.5 * (1 - el));
  ttxt.textContent = Math.ceil(60 * (1 - el)) + 's';
}, 50);

document.getElementById('replay').onclick = play;
play();
</script>
</body>
</html>
